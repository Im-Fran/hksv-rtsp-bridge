services:
  hksv-rtsp-bridge:
    build: .
    image: hksv-rtsp-bridge
    # mDNS/Bonjour needs the same L2 network as the hub.
    network_mode: host
    restart: unless-stopped
    # Only for hwaccel = "vaapi". Remove this block if there is no /dev/dri (or hwaccel = "none").
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config.toml:/etc/hksv-rtsp-bridge/config.toml:ro
      - ./state:/var/lib/hksv-rtsp-bridge
