[package]
name = "local-dvr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Bridges RTSP cameras to HomeKit: live view, remote streaming and HomeKit Secure Video"

[dependencies]
aes = "0.9"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.22.1"
bitflags = "2.13.2"
bytes = "1.12.2"
chacha20poly1305 = "0.11.0"
ctr = "0.10"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13"
md-5 = "0.11"
libc = "0.2"
mdns-sd = "0.22.0"
num-bigint = "0.5.1"
percent-encoding = "2"
rand = "0.10.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
retina = "0.4.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal", "process"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v5"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
tempfile = "3.27.0"
