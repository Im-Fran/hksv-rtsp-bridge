name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build and publish (e.g. v1.2.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/im-fran/hksv-rtsp-bridge

jobs:
  image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9.+_-]+$'; then
            echo "::error::Invalid tag: $TAG"; exit 1
          fi
          # Tag format: <version>[+<build>], optional leading "v". A "-" marks a pre-release.
          VERSION="${TAG#v}"
          VERSION="${VERSION//+/_}"
          case "$TAG" in *-*) LATEST=false ;; *) LATEST=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.latest }}
          labels: |
            org.opencontainers.image.title=hksv-rtsp-bridge
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
